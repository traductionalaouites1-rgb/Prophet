name: Deep scan ALNOURPEDIA outstanding work

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REPOSITORY: houseofwordslangue-dev/Prophet
  CANONICAL_ORIGIN: https://alnourpedia.org

jobs:
  audits:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private-source token
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_REPO_TOKEN:-}" || { echo "::error::Missing SOURCE_REPO_TOKEN"; exit 1; }

      - name: Resolve pinned ALNOURPEDIA source commit
        shell: bash
        run: |
          set -euo pipefail
          PINNED_SOURCE_SHA="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/.deployment-trigger" | sed -n 's/^source_sha=//p' | head -n1 | tr -d '\r')"
          [[ "$PINNED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid or missing source_sha in .deployment-trigger"; exit 1; }
          echo "PINNED_SOURCE_SHA=$PINNED_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Checkout explicitly pinned private source
        uses: actions/checkout@v4
        with:
          repository: houseofwordslangue-dev/Prophet
          ref: ${{ env.PINNED_SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$PINNED_SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Human editorial quality audit
        shell: bash
        continue-on-error: true
        run: |
          set +e
          mkdir -p _audit
          python3 scripts/audit_public_human_quality.py --root . --json _audit/PUBLIC-HUMAN-QUALITY.json --md _audit/PUBLIC-HUMAN-QUALITY.md
          exit 0

      - name: Parallel-product reconciliation audit
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 scripts/audit_parallel_products.py --root . --json _audit/PARALLEL-PRODUCT-INVENTORY.json --md _audit/PARALLEL-PRODUCT-INVENTORY.md
          exit 0

      - name: Machine rewrite queue audit
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 scripts/audit_machine_rewrite_queue.py
          exit 0

      - name: Publication build diagnostic
        shell: bash
        continue-on-error: true
        run: |
          set +e
          python3 scripts/normalize_public_media_snapshot.py
          python3 scripts/build_publication_release.py --output _deep_scan_release --source-sha "$SOURCE_SHA"
          b=$?
          if [ $b -eq 0 ]; then python3 scripts/recover_shifa_release.py --release _deep_scan_release; b=$?; fi
          if [ $b -eq 0 ]; then python3 scripts/editorial_publication_cleanup.py --release _deep_scan_release; b=$?; fi
          exit 0

      - name: Summarize outstanding work
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out={
              "product":"ALNOURPEDIA",
              "canonical_origin":os.environ.get("CANONICAL_ORIGIN"),
              "source_sha":os.environ.get("SOURCE_SHA"),
          }
          p=Path("_audit/PUBLIC-HUMAN-QUALITY.json")
          if p.exists():
              d=json.loads(p.read_text("utf-8"))
              out["human_quality"]={k:v for k,v in d.items() if k!="findings"}
          p=Path("_audit/PARALLEL-PRODUCT-INVENTORY.json")
          if p.exists():
              d=json.loads(p.read_text("utf-8"))
              out["parallel_products"]={
                  "files_scanned":d.get("files_scanned"),
                  "duplicate_body_group_count":d.get("duplicate_body_group_count"),
                  "title_collision_group_count":d.get("title_collision_group_count"),
                  "flag_counts":d.get("flag_counts"),
                  "queue_counts":{k:len(v) for k,v in (d.get("queues") or {}).items()},
              }
          p=Path("27-project/reports/MACHINE-REWRITE-QUEUE-2026-09-13.json")
          if p.exists():
              d=json.loads(p.read_text("utf-8"))
              out["machine_rewrite_queue"]={k:v for k,v in d.items() if k not in {"items","files","findings"}}
          p=Path("_deep_scan_release/RELEASE-MANIFEST.json")
          if p.exists():
              d=json.loads(p.read_text("utf-8"))
              out["publication_build"]={
                  "indexed_public_items":d.get("indexed_public_items"),
                  "public_items_by_type":d.get("public_items_by_type"),
                  "excluded_by_publication_gate":d.get("excluded_by_publication_gate"),
                  "status":d.get("status"),
              }
          print("ALNOURPEDIA_DEEP_SCAN="+json.dumps(out,ensure_ascii=False))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### ALNOURPEDIA deep outstanding-work scan\n\n")
              f.write("Canonical origin: "+str(out.get("canonical_origin"))+"\n\n")
              f.write("Pinned source commit: "+str(out.get("source_sha"))+"\n\n")
              f.write(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY
