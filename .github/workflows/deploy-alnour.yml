name: Deploy ALNOURPEDIA production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-alnour.yml'
      - '.deployment-trigger'

permissions:
  contents: read

concurrency:
  group: deploy-alnour-nindohost-production
  cancel-in-progress: false

env:
  RELEASE_ROOT: _publication_release
  RELEASE_NAME: ALNOURPEDIA-Nindohost-Production
  CANONICAL_ORIGIN: https://alnourpedia.org
  SOURCE_REPOSITORY: houseofwordslangue-dev/Prophet

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Validate mirror secrets
        shell: bash
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
          NINDOHOST_FTP_HOST: ${{ secrets.NINDOHOST_FTP_HOST }}
          NINDOHOST_FTP_USER: ${{ secrets.NINDOHOST_FTP_USER }}
          NINDOHOST_FTP_PASSWORD: ${{ secrets.NINDOHOST_FTP_PASSWORD }}
          NINDOHOST_FTP_PORT: ${{ secrets.NINDOHOST_FTP_PORT }}
        run: |
          set -euo pipefail
          for var in SOURCE_REPO_TOKEN NINDOHOST_FTP_HOST NINDOHOST_FTP_USER NINDOHOST_FTP_PASSWORD; do
            [ -n "${!var:-}" ] || { echo "::error::Missing required secret: $var"; exit 1; }
          done
          EFFECTIVE_PORT="${NINDOHOST_FTP_PORT:-21}"
          case "$EFFECTIVE_PORT" in ''|*[!0-9]*) echo '::error::FTP/FTPS port must be numeric'; exit 1;; esac
          echo "NINDOHOST_EFFECTIVE_PORT=$EFFECTIVE_PORT" >> "$GITHUB_ENV"
          echo "NINDOHOST_EFFECTIVE_REMOTE_DIR=alnourpedia" >> "$GITHUB_ENV"

      - name: Resolve explicitly requested source commit
        shell: bash
        run: |
          set -euo pipefail
          PINNED_SOURCE_SHA="$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/.deployment-trigger" | sed -n 's/^source_sha=//p' | head -n1 | tr -d '\r')"
          [[ "$PINNED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid or missing source_sha in .deployment-trigger"; exit 1; }
          echo "PINNED_SOURCE_SHA=$PINNED_SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Checkout explicitly pinned private source
        uses: actions/checkout@v4
        with:
          repository: houseofwordslangue-dev/Prophet
          ref: ${{ env.PINNED_SOURCE_SHA }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Pin source commit
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$PINNED_SOURCE_SHA"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli lftp
          python3 -m py_compile \
            scripts/normalize_public_media_snapshot.py \
            scripts/build_publication_release.py \
            scripts/recover_shifa_release.py \
            scripts/editorial_publication_cleanup.py \
            scripts/alnour_seo_regression_gate.py \
            scripts/alnour_production_gate.py \
            scripts/audit_public_human_quality.py \
            scripts/alnour_tasheel_parity_gate.py

      - name: Editorial and runtime parity preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _preflight
          python3 scripts/audit_public_human_quality.py --root . --json _preflight/PUBLIC-HUMAN-QUALITY.json --md _preflight/PUBLIC-HUMAN-QUALITY.md
          python3 - <<'PY'
          import json
          d=json.load(open('_preflight/PUBLIC-HUMAN-QUALITY.json',encoding='utf-8'))
          assert d.get('status')=='PASS'
          assert d.get('critical_severity',0)==0
          assert d.get('high_severity',0)==0
          assert d.get('blocker_files',0)==0
          PY
          python3 scripts/alnour_tasheel_parity_gate.py --site site --origin "$CANONICAL_ORIGIN"

      - name: Build exact curated publication tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/normalize_public_media_snapshot.py
          RELEASE_DIR="$RELEASE_ROOT/$RELEASE_NAME"
          python3 scripts/build_publication_release.py --output "$RELEASE_DIR" --source-sha "$SOURCE_SHA"
          python3 scripts/recover_shifa_release.py --release "$RELEASE_DIR"
          python3 scripts/editorial_publication_cleanup.py --release "$RELEASE_DIR"
          PUBLICATION_SITE="$RELEASE_DIR/site"
          test -d "$PUBLICATION_SITE"
          test -f "$RELEASE_DIR/SHIFA-EDITORIAL-RECOVERY.json"
          test -f "$RELEASE_DIR/EDITORIAL-PUBLICATION-CLEANUP.json"
          mkdir -p "$PUBLICATION_SITE/.well-known"
          export PUBLICATION_SITE SOURCE_SHA
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          marker={
            "product":"ALNOURPEDIA",
            "source_branch":"main",
            "source_commit":os.environ["SOURCE_SHA"],
            "built_utc":datetime.now(timezone.utc).isoformat(),
            "production_gate":"10",
            "curated_media":"builder-restored-exactly-692",
            "shifa_recovery":"required-and-passed",
            "editorial_cleanup":"required-and-passed",
            "deployment":"alnourpedia-org-nindohost-public-mirror"
          }
          (Path(os.environ["PUBLICATION_SITE"])/".well-known/alnour-release.json").write_text(
            json.dumps(marker,ensure_ascii=False,indent=2)+"\n","utf-8"
          )
          PY
          echo "PUBLICATION_SITE=$PUBLICATION_SITE" >> "$GITHUB_ENV"

      - name: Fail-closed local production acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/alnour_seo_regression_gate.py --site "$PUBLICATION_SITE" --origin "$CANONICAL_ORIGIN"
          python3 scripts/alnour_production_gate.py --site "$PUBLICATION_SITE" --origin "$CANONICAL_ORIGIN"
          export SOURCE_SHA RELEASE_ROOT RELEASE_NAME PUBLICATION_SITE
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release=Path(os.environ["RELEASE_ROOT"])/os.environ["RELEASE_NAME"]
          m=json.loads((release/"RELEASE-MANIFEST.json").read_text("utf-8"))
          c=json.loads((release/"EDITORIAL-PUBLICATION-CLEANUP.json").read_text("utf-8"))
          s=json.loads((release/"SHIFA-EDITORIAL-RECOVERY.json").read_text("utf-8"))
          marker=json.loads((Path(os.environ["PUBLICATION_SITE"])/".well-known/alnour-release.json").read_text("utf-8"))
          assert m.get("source_branch")=="main"
          assert m.get("source_commit")==os.environ["SOURCE_SHA"]==marker.get("source_commit")
          assert s.get("status")=="PASS"
          assert s.get("shifa_articles_recovered",0) <= s.get("shifa_articles_scanned",0)
          assert c.get("status")=="PASS"
          assert c.get("media_catalogue_records_detected")==692
          assert c.get("media_catalogue_records_surviving")==692
          assert m.get("editorial_cleanup",{}).get("status")=="PASS"
          assert m.get("indexed_public_items")==c.get("surviving_public_items")
          assert m.get("indexed_public_items",0)>=1000
          PY

      - name: Verify pinned source before production write
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$PINNED_SOURCE_SHA"

      - name: Deploy ALNOURPEDIA tree with runtime last
        shell: bash
        env:
          NINDOHOST_FTP_HOST: ${{ secrets.NINDOHOST_FTP_HOST }}
          NINDOHOST_FTP_USER: ${{ secrets.NINDOHOST_FTP_USER }}
          NINDOHOST_FTP_PASSWORD: ${{ secrets.NINDOHOST_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          # The cPanel document root is intentionally fixed to the new site folder.
          # No fallback to FTP "." or any other legacy document root is permitted.
          test "$NINDOHOST_EFFECTIVE_REMOTE_DIR" = "alnourpedia"

          lftp <<LFTP
          set cmd:fail-exit true
          set cmd:trace false
          set ftp:passive-mode true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:max-retries 3
          set net:timeout 20
          set net:reconnect-interval-base 5
          open -p "$NINDOHOST_EFFECTIVE_PORT" -u "$NINDOHOST_FTP_USER","$NINDOHOST_FTP_PASSWORD" "$NINDOHOST_FTP_HOST"
          cd "$NINDOHOST_EFFECTIVE_REMOTE_DIR"
          lcd "$PUBLICATION_SITE"

          # Upload content/assets/support files first. Public entry points and
          # routing/control files are excluded here so readers never see a new
          # runtime against an incomplete support tree.
          mirror --reverse --continue --only-newer --no-perms --parallel=4 --verbose=1 \
            --exclude-glob ".env" \
            --exclude-glob ".env.*" \
            --exclude-glob "*.zip" \
            --exclude-glob "*.sha256" \
            --exclude-glob ".well-known/acme-challenge/**" \
            --exclude-glob "index.php" \
            --exclude-glob "index.html" \
            --exclude-glob "homepage.html" \
            --exclude-glob "home.php" \
            --exclude-glob "home-fallback.html" \
            --exclude-glob "content.php" \
            --exclude-glob "content-lib.php" \
            --exclude-glob "public-shell.php" \
            --exclude-glob "browse.php" \
            --exclude-glob "search.php" \
            --exclude-glob "api.php" \
            --exclude-glob "asset.php" \
            --exclude-glob "chat.php" \
            --exclude-glob "home-feed.php" \
            --exclude-glob "seo.php" \
            --exclude-glob "sitemap.php" \
            --exclude-glob "robots.txt" \
            --exclude-glob "llms.txt" \
            --exclude-glob "manifest.webmanifest" \
            --exclude-glob "sw.js" \
            --exclude-glob "media.html" \
            --exclude-glob ".htaccess" \
            --exclude-glob ".well-known/alnour-release.json" \
            ./ ./

          # Commit the complete public control surface only after support files
          # have transferred successfully.
          mput -O . index.php index.html homepage.html home.php home-fallback.html content.php content-lib.php public-shell.php browse.php search.php api.php asset.php chat.php home-feed.php seo.php sitemap.php robots.txt llms.txt manifest.webmanifest sw.js media.html .htaccess
          mirror --reverse --continue --no-perms --parallel=1 --include-glob ".well-known/alnour-release.json" --exclude-glob "*" ./ ./

          cls -1 home.php
          cls -1 seo.php
          cls -1 sitemap.php
          cls -1 robots.txt
          cls -1 .well-known/alnour-release.json
          cls -1 _content/.htaccess
          cls -1 data/.htaccess
          bye
          LFTP

      - name: Verify pinned source after FTP
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$SOURCE_SHA" = "$PINNED_SOURCE_SHA"

      - name: Live production acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/alnour_production_gate.py --live --origin "$CANONICAL_ORIGIN" --expected-sha "$SOURCE_SHA" --retries 6

      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ALNOURPEDIA production deployment"
            echo "- Authoritative repository: houseofwordslangue-dev/Prophet"
            echo "- Explicitly pinned source commit: ${SOURCE_SHA:-unknown}"
            echo "- Canonical production origin: https://alnourpedia.org"
            echo "- Curated build, editorial cleanup, SEO and production gates run before FTP"
            echo "- Explicit FTPS only; fixed document root: alnourpedia; support tree first, runtime last"
            echo "- Live SHA, canonical host, private-path and AR/FR/EN verification runs after upload"
          } >> "$GITHUB_STEP_SUMMARY"
